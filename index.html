<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>钓红点联机房间测试</title>
  <style>
    :root{--bg:#0f5132;--panel:#fff8ec;--green:#1f7a4f;--gold:#ffc85c;--text:#2b2520;--muted:#756f68;--danger:#b42318}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(#073b25,#127244);color:var(--text);min-height:100vh;padding:16px}
    .wrap{max-width:780px;margin:0 auto}.title{text-align:center;color:#fff;margin:10px 0 18px}.title h1{margin:0;font-size:28px}.title p{margin:8px 0 0;color:#e6fff2}
    .card{background:var(--panel);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 22px #0002}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{margin:4px 0}
    button{border:0;border-radius:12px;padding:12px 16px;background:var(--gold);font-weight:800;font-size:16px;box-shadow:0 4px 10px #0002}button.secondary{background:#fff}button.danger{background:#ffd7d2;color:var(--danger)}button:disabled{opacity:.45}
    input{border:1px solid #ddd;border-radius:12px;padding:12px;font-size:18px;width:150px;text-transform:uppercase}.big{font-size:22px;font-weight:900}.muted{color:var(--muted)}.pill{display:inline-block;background:#e9f6ee;color:#16643f;border-radius:999px;padding:6px 10px;margin:4px;font-weight:700}
    .players{display:grid;grid-template-columns:1fr;gap:8px}.player{background:#fff;border-radius:14px;padding:12px;border:1px solid #eee;display:flex;justify-content:space-between}.me{border:2px solid var(--green)}
    .log{background:#fff;border-radius:14px;padding:12px;height:180px;overflow:auto;line-height:1.7}.ok{color:#126b3b;font-weight:800}.warn{color:#9a5b00;font-weight:800}.small{font-size:13px}.copy{user-select:all;background:#fff;border:1px dashed #bbb;padding:10px;border-radius:10px;display:block;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title"><h1>潮汕钓红点</h1><p>联机房间测试版：先验证创建/加入/同步</p></div>

    <div id="home" class="card">
      <div class="big">1）先测试房间同步</div>
      <p class="muted">一台手机创建房间，另一台手机打开同一网页输入房间号加入。如果两边都能看到玩家人数变化，说明联机基础跑通。</p>
      <div class="row">
        <input id="nameInput" placeholder="你的名字" maxlength="12">
        <button id="createBtn">创建房间</button>
      </div>
      <hr style="border:0;border-top:1px solid #eadfce;margin:16px 0">
      <div class="row">
        <input id="roomInput" placeholder="房间号" maxlength="6">
        <button id="joinBtn" class="secondary">加入房间</button>
      </div>
      <p class="small muted">提示：房间号是 6 位数字。这个版本还不是正式游戏，只是联机测试。</p>
    </div>

    <div id="room" class="card" style="display:none">
      <div class="row" style="justify-content:space-between">
        <div><span class="big">房间：</span><span id="roomCode" class="big ok"></span></div>
        <button id="leaveBtn" class="danger">离开</button>
      </div>
      <p class="muted">把这个房间号或当前网页链接发给朋友。朋友打开后输入房间号加入。</p>
      <span id="shareText" class="copy"></span>
      <div style="margin-top:14px">
        <span class="pill" id="statusPill">等待中</span>
        <span class="pill" id="countPill">0 人</span>
      </div>
    </div>

    <div id="playersCard" class="card" style="display:none">
      <div class="big">房间玩家</div>
      <div id="players" class="players" style="margin-top:12px"></div>
      <div class="row" style="margin-top:12px">
        <button id="startBtn">房主测试开始</button>
        <button id="pingBtn" class="secondary">发送测试消息</button>
      </div>
      <p class="small muted">只有房主点“测试开始”有效。后面正式游戏会把这里改成发牌和轮流出牌。</p>
    </div>

    <div id="logCard" class="card" style="display:none">
      <div class="big">同步记录</div>
      <div id="logs" class="log"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
    import { getDatabase, ref, set, update, onValue, get, push, onDisconnect, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyCgr8wLKe_BfWRs2mnSeEJVd7LggNa7uEY",
      authDomain: "diaohongdian.firebaseapp.com",
      databaseURL: "https://diaohongdian-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "diaohongdian",
      storageBucket: "diaohongdian.firebasestorage.app",
      messagingSenderId: "494073636915",
      appId: "1:494073636915:web:eec07630e901382d329b46",
      measurementId: "G-VXVECSZLHB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const $ = (id)=>document.getElementById(id);
    const clientId = localStorage.getItem('dhd_client_id') || ('u_' + Math.random().toString(36).slice(2,10));
    localStorage.setItem('dhd_client_id', clientId);
    let currentRoom = null;
    let unsubscribe = null;
    let roomData = null;

    function code(){ return String(Math.floor(100000 + Math.random()*900000)); }
    function name(){ return $('nameInput').value.trim() || '玩家' + clientId.slice(-4); }
    function showRoomUI(roomCode){
      $('home').style.display='none'; $('room').style.display='block'; $('playersCard').style.display='block'; $('logCard').style.display='block';
      $('roomCode').textContent=roomCode;
      $('shareText').textContent = location.origin + location.pathname + '?room=' + roomCode;
    }
    function showHome(){
      $('home').style.display='block'; $('room').style.display='none'; $('playersCard').style.display='none'; $('logCard').style.display='none';
      $('players').innerHTML=''; $('logs').innerHTML=''; currentRoom=null; roomData=null;
    }
    function addLocalLog(s){ const d=document.createElement('div'); d.textContent=s; $('logs').prepend(d); }
    async function addLog(s){ if(!currentRoom) return; await push(ref(db, `rooms/${currentRoom}/logs`), {text:s, t:Date.now()}); }
    async function joinRoom(roomCode, asHost=false){
      currentRoom = roomCode;
      const pRef = ref(db, `rooms/${roomCode}/players/${clientId}`);
      await update(pRef, { id:clientId, name:name(), joinedAt: Date.now(), online:true, host:asHost });
      onDisconnect(pRef).update({ online:false, leftAt: serverTimestamp() });
      showRoomUI(roomCode);
      if(unsubscribe) unsubscribe();
      onValue(ref(db, `rooms/${roomCode}`), snap=>{ roomData=snap.val(); render(); });
      await addLog(`${name()} 加入房间。`);
    }
    async function createRoom(){
      const roomCode = code();
      await set(ref(db, `rooms/${roomCode}`), { status:'waiting', hostId:clientId, createdAt:Date.now(), players:{}, logs:{} });
      await joinRoom(roomCode, true);
    }
    async function joinExisting(){
      const roomCode = $('roomInput').value.trim();
      if(!/^\d{6}$/.test(roomCode)){ alert('请输入6位房间号'); return; }
      const snap = await get(ref(db, `rooms/${roomCode}`));
      if(!snap.exists()){ alert('房间不存在，请确认房间号'); return; }
      await joinRoom(roomCode, false);
    }
    function render(){
      if(!roomData) return;
      const players = Object.values(roomData.players || {});
      $('statusPill').textContent = roomData.status === 'started' ? '已测试开始' : '等待中';
      $('countPill').textContent = players.filter(p=>p.online).length + ' 人在线';
      $('players').innerHTML = players.map(p=>`<div class="player ${p.id===clientId?'me':''}"><span>${escapeHtml(p.name)} ${p.host?'（房主）':''} ${p.id===clientId?'（你）':''}</span><span>${p.online?'在线':'离线'}</span></div>`).join('');
      const logs = Object.values(roomData.logs || {}).sort((a,b)=>(b.t||0)-(a.t||0)).slice(0,30);
      $('logs').innerHTML = logs.map(l=>`<div>${escapeHtml(l.text)}</div>`).join('');
    }
    function escapeHtml(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

    $('createBtn').onclick=createRoom;
    $('joinBtn').onclick=joinExisting;
    $('leaveBtn').onclick=async()=>{ if(currentRoom){ await update(ref(db, `rooms/${currentRoom}/players/${clientId}`), {online:false,leftAt:Date.now()}); } showHome(); };
    $('pingBtn').onclick=()=>addLog(`${name()} 发送了一条测试消息。`);
    $('startBtn').onclick=async()=>{
      if(!roomData || roomData.hostId!==clientId){ alert('只有房主可以点测试开始'); return; }
      await update(ref(db, `rooms/${currentRoom}`), {status:'started', startedAt:Date.now()});
      await addLog('房主点击了测试开始。');
    };

    const urlRoom = new URLSearchParams(location.search).get('room');
    if(urlRoom){ $('roomInput').value=urlRoom; }
  </script>
</body>
</html>
